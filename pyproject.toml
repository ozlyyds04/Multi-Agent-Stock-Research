    "idna>=3.18",
    "iniconfig>=2.3.0",
    "jinja2>=3.1.6",
    "jiter>=0.16.0",
    "jsonpatch>=1.33",
    "jsonpointer>=3.1.1",
    "kiwisolver>=1.5.0",
    "langchain>=1.3.14",
    "langchain-community>=0.3.31",
    "langchain-core>=1.5.3",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "langgraph-checkpoint>=4.1.1",
