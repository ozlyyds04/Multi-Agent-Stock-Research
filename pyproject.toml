    "charset-normalizer>=3.4.9",
    "click>=8.4.2",
    "colorama>=0.4.6",
    "contourpy>=1.3.2",
    "curl-cffi>=0.16.0",
    "cycler>=0.12.1",
    "dataclasses-json>=0.6.7",
    "distro>=1.9.0",
    "exceptiongroup>=1.3.1",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "fonttools>=4.63.0",
    "fpdf2>=2.8.8",
    "frozendict>=2.4.7",
    "frozenlist>=1.8.0",
    "greenlet>=3.5.4",
