[tool.pytest.ini_options]
pythonpath = ["src"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true


[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-mock>=3.12",
  "ruff>=0.6",
  "black>=24.0",
  "httpx>=0.27"  # for FastAPI TestClient transport
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
# 只抓真正的静态错误：pycodestyle 错误类 + pyflakes（未定义/未使用/异常）
select = ["E4", "E7", "E9", "F"]


[tool.black]
line-length = 120
