    "ormsgpack>=1.12.2",
    "packaging>=26.2",
    "pandas>=2.3.3",
    "peewee>=4.3.0",
    "pillow>=12.3.0",
    "platformdirs>=4.11.0",
    "pluggy>=1.6.0",
    "prometheus-client>=0.26.0",
    "propcache>=0.5.2",
    "protobuf>=7.35.1",
    "psycopg[binary]>=3.3.4",
    "pycparser>=3.0",
    "pydantic>=2.13.4",
    "pydantic-core>=2.46.4",
