<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="720px" height="760px" viewBox="0 0 720 760"
     style="background:#ffffff; font-family:'Microsoft YaHei',Arial,Helvetica,sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <text x="360" y="26" font-size="17" font-weight="bold" text-anchor="middle" fill="#000000">
    多智能体股票研究 - 主流程
  </text>

  <rect x="270" y="48" width="180" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="360" y="74" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">用户</text>

  <rect x="230" y="118" width="260" height="54" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="360" y="142" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">Vue 3 前端（nginx :8080）</text>
  <text x="360" y="160" font-size="11" text-anchor="middle" fill="#333333">SSE 实时 · 审批 · 历史</text>

  <rect x="230" y="200" width="260" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="360" y="225" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">FastAPI 后端</text>
  <text x="360" y="243" font-size="11" text-anchor="middle" fill="#333333">异步任务 · SSE · /metrics</text>

  <rect x="180" y="284" width="360" height="86" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="360" y="309" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">Celery Worker（LangGraph 多智能体流水线）</text>
  <text x="360" y="328" font-size="11" text-anchor="middle" fill="#333333">数据 → 分析 → 合规 → 主管</text>
  <text x="360" y="344" font-size="11" text-anchor="middle" fill="#333333">人工审批边（HITL）· 工具调用补数</text>
  <text x="360" y="360" font-size="10.5" text-anchor="middle" fill="#333333">LLM：DeepSeek（vision-exp）</text>

  <rect x="230" y="398" width="260" height="54" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="360" y="422" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">报告发布</text>
  <text x="360" y="440" font-size="11" text-anchor="middle" fill="#333333">Markdown · PDF · 图表 · JSON</text>

  <rect x="230" y="480" width="260" height="50" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="360" y="504" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">产物（/artifacts 下载/预览）</text>

  <line x1="360" y1="90" x2="360" y2="118" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="172" x2="360" y2="200" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="374" y="190" font-size="10.5" fill="#333333" style="paint-order:stroke;stroke:#ffffff;stroke-width:3">提交</text>
  <line x1="360" y1="256" x2="360" y2="284" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="374" y="274" font-size="10.5" fill="#333333" style="paint-order:stroke;stroke:#ffffff;stroke-width:3">入队任务</text>
  <line x1="360" y1="370" x2="360" y2="398" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="452" x2="360" y2="480" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- SSE 事件回传前端 -->
  <path d="M230,290 H120 V145 H230" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text transform="rotate(-90 120 220)" x="120" y="220" font-size="10.5" fill="#333333" text-anchor="middle"
        style="paint-order:stroke;stroke:#ffffff;stroke-width:3">SSE 事件回传前端</text>

  <text x="360" y="571" font-size="11" text-anchor="middle" fill="#333333">docker compose up -d --build</text>
</svg>
