<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     version="1.1" width="820px" height="900px" viewBox="0 0 820 900"
     style="background: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <text x="410" y="26" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">
    Multi-Agent Stock Research - Architecture
  </text>

  <!-- main column: x=260..560, center 410 -->
  <rect x="260" y="48" width="300" height="44" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="410" y="75" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">User</text>

  <rect x="260" y="116" width="300" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="410" y="141" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">Interface</text>
  <text x="410" y="160" font-size="11" text-anchor="middle" fill="#333333">Streamlit UI / FastAPI / CLI</text>

  <rect x="260" y="196" width="300" height="64" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="410" y="226" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">Data Agent</text>
  <text x="410" y="245" font-size="11" text-anchor="middle" fill="#333333">Prices - Fundamentals - News</text>

  <rect x="260" y="304" width="300" height="64" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="410" y="334" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">Analyst Agent</text>
  <text x="410" y="353" font-size="11" text-anchor="middle" fill="#333333">LLM Narrative + Tool Calling</text>

  <rect x="260" y="392" width="300" height="64" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="410" y="422" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">Compliance Agent</text>
  <text x="410" y="441" font-size="11" text-anchor="middle" fill="#333333">Disclosures &amp; Filters</text>

  <rect x="260" y="480" width="300" height="64" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="410" y="510" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">Approval Edge (HITL)</text>
  <text x="410" y="529" font-size="11" text-anchor="middle" fill="#333333">interrupt - PostgreSQL persisted</text>

  <rect x="260" y="568" width="300" height="64" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="410" y="598" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">Supervisor Agent</text>
  <text x="410" y="617" font-size="11" text-anchor="middle" fill="#333333">Final Review &amp; Report</text>

  <rect x="260" y="656" width="300" height="64" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="410" y="686" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">Report Publisher</text>
  <text x="410" y="705" font-size="11" text-anchor="middle" fill="#333333">Markdown - PDF - Chart - JSON</text>

  <!-- artifacts row -->
  <rect x="100" y="744" width="120" height="48" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="160" y="772" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Markdown (.md)</text>
  <rect x="240" y="744" width="120" height="48" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="300" y="772" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">PDF (.pdf)</text>
  <rect x="380" y="744" width="120" height="48" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="440" y="772" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Chart (.png)</text>
  <rect x="520" y="744" width="120" height="48" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="580" y="772" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">JSON (.json)</text>

  <!-- repair / validate branch: x=600..800 -->
  <rect x="600" y="196" width="200" height="64" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="700" y="226" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">Repair Node</text>
  <text x="700" y="245" font-size="10.5" text-anchor="middle" fill="#333333">Re-fetch missing data</text>

  <rect x="600" y="284" width="200" height="64" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="700" y="314" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">Validate Node</text>
  <text x="700" y="333" font-size="10.5" text-anchor="middle" fill="#333333">Strict abort / degrade</text>

  <!-- main flow arrows -->
  <line x1="410" y1="92" x2="410" y2="116" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="172" x2="410" y2="196" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="260" x2="410" y2="304" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="422" y="286" font-size="10.5" fill="#333333" style="paint-order:stroke;stroke:#ffffff;stroke-width:3">data complete</text>
  <line x1="410" y1="368" x2="410" y2="392" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="456" x2="410" y2="480" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="544" x2="410" y2="568" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="422" y="560" font-size="10.5" fill="#333333" style="paint-order:stroke;stroke:#ffffff;stroke-width:3">approved / edited</text>
  <line x1="410" y1="632" x2="410" y2="656" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- data missing branch -->
  <path d="M560,228 H600 V196 H700" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="580" y="220" font-size="10.5" fill="#333333" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3">missing</text>
  <line x1="700" y1="260" x2="700" y2="284" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="712" y="276" font-size="10.5" fill="#333333" style="paint-order:stroke;stroke:#ffffff;stroke-width:3">still missing</text>
  <path d="M600,260 H580 V336 H560" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <text transform="rotate(-90 588 300)" x="588" y="300" font-size="10.5" fill="#333333" text-anchor="middle"
        style="paint-order:stroke;stroke:#ffffff;stroke-width:3">repaired</text>
  <line x1="600" y1="316" x2="560" y2="316" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="580" y="312" font-size="10.5" fill="#333333" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3">degrade</text>

  <!-- approval bypass + reject loop -->
  <path d="M560,424 H620 V600 H560" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="632" y="512" font-size="10.5" fill="#333333" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3">no approval</text>
  <path d="M260,512 H200 V336 H260" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text transform="rotate(-90 190 424)" x="190" y="424" font-size="10.5" fill="#333333" text-anchor="middle"
        style="paint-order:stroke;stroke:#ffffff;stroke-width:3">rejected (&lt;=3) w/ feedback</text>

  <!-- publisher -> artifacts -->
  <path d="M410,720 V736 H160 V744" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M410,736 H300 V744" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M410,736 H440 V744" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M410,736 H580 V744" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- artifacts -> end -->
  <line x1="160" y1="792" x2="160" y2="800" stroke="#111111" stroke-width="1.5"/>
  <line x1="300" y1="792" x2="300" y2="800" stroke="#111111" stroke-width="1.5"/>
  <line x1="440" y1="792" x2="440" y2="800" stroke="#111111" stroke-width="1.5"/>
  <line x1="580" y1="792" x2="580" y2="800" stroke="#111111" stroke-width="1.5"/>
  <line x1="160" y1="800" x2="580" y2="800" stroke="#111111" stroke-width="1.5"/>
  <line x1="410" y1="800" x2="410" y2="820" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="350" y="820" width="120" height="36" rx="18" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="410" y="843" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">End</text>
</svg>
